<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ocean Birthday</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a4f7a; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<script>
(function () {
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
    };
  }
  var canvas = document.getElementById('sea');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, S = 1, dpr = 1;
  var MESSAGE = "Happy belated b'day Riddhi, see you in Jan";

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    S = Math.max(0.55, Math.min(1.25, Math.min(W, H) / 560)); // diver scale
    buildSeaweed();
    if (started) initCreatures();
  }

  // ---------- state ----------
  var diver = { x: 0, y: 0, vx: 0, vy: 0, face: 1, t: 0, pitch: 0 };
  var target = { x: 0, y: 0 };
  var bubbles = [];
  var seaweed = [];
  var fish = { x: 0, y: 0, vx: 40, vy: 0, wx: 0, wy: 0, face: 1, t: 0, size: 1, sp: 55,
               ylo: 0.30, yhi: 0.65, body: '#ff8a1f', fin: '#ff9a2e', tail: '#ff7a00', stripe: '#ffffff' };
  var school = [], jellies = [], stars = [], corals = [], octo = null, crab = null;
  var FISH_COLORS = [
    ['#ff4fa3', '#ff8cc6', '#ffffff'], ['#3b82f6', '#93c5fd', '#ffe14d'], ['#ffd21f', '#ffea7a', '#2b2f3a'],
    ['#22c55e', '#86efac', '#ffffff'], ['#a855f7', '#d8b4fe', '#ffffff'], ['#ef4444', '#fca5a5', '#ffffff'],
    ['#14b8a6', '#99f6e4', '#fde047']
  ];
  var started = false;

  function setTarget(e) {
    target.x = e.clientX; target.y = e.clientY;
    if (e.cancelable && e.pointerType === 'touch') e.preventDefault();
  }
  window.addEventListener('pointermove', setTarget, { passive: false });
  window.addEventListener('pointerdown', setTarget, { passive: false });
  window.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener('resize', resize);

  function buildSeaweed() {
    seaweed = [];
    var n = Math.max(5, Math.round(W / 130));
    for (var i = 0; i < n; i++) {
      seaweed.push({
        x: (i + 0.3 + Math.random() * 0.4) / n * W,
        h: (70 + Math.random() * 110) * S,
        w: (9 + Math.random() * 5) * S,
        ph: Math.random() * 6.28,
        sp: 0.8 + Math.random() * 0.6,
        hue: [135, 150, 170, 290, 330, 20][i % 6]
      });
    }
  }

  function pickFishWaypoint(f) {
    f = f || fish;
    f.wx = W * (0.08 + Math.random() * 0.84);
    f.wy = H * (f.ylo + Math.random() * (f.yhi - f.ylo));
  }

  function initCreatures() {
    school = [];
    var n = W < 600 ? 6 : 9;
    for (var i = 0; i < n; i++) {
      var c = FISH_COLORS[i % FISH_COLORS.length];
      var f = { x: Math.random() * W, y: H * (0.15 + Math.random() * 0.55), vx: 30, vy: 0, wx: 0, wy: 0,
                face: 1, t: Math.random() * 10, size: 0.4 + Math.random() * 0.4, sp: 40 + Math.random() * 45,
                ylo: 0.12, yhi: 0.72, body: c[0], fin: c[1], tail: c[1], stripe: c[2] };
      pickFishWaypoint(f);
      school.push(f);
    }
    jellies = [];
    for (i = 0; i < 2; i++) {
      jellies.push({ x: W * (0.2 + i * 0.55), y: H * (0.3 + i * 0.1), bx: W * (0.2 + i * 0.55), by: H * (0.3 + i * 0.1),
                     ph: Math.random() * 6, size: 0.9 + Math.random() * 0.4 });
    }
    corals = [];
    var cc = ['#ff5d8f', '#ff9f1c', '#b565ff', '#2ec4b6'];
    var cn = Math.max(3, Math.round(W / 230));
    for (i = 0; i < cn; i++) {
      corals.push({ x: (i + 0.5 + (Math.random() - 0.5) * 0.4) / cn * W, s: 0.8 + Math.random() * 0.6, col: cc[i % 4] });
    }
    octo = { x: W * 0.8, y: H * 0.62, vx: 0, vy: 0, wx: W * 0.8, wy: H * 0.62, t: 0 };
    crab = { x: W * 0.3, dir: 1, pause: 0, t: 0 };
    stars = [];
    var cols = ['#ff6b6b', '#ff9f43', '#feca57', '#ff78b5', '#f97316'];
    var m = Math.max(5, Math.round(W / 150));
    for (i = 0; i < m; i++) {
      stars.push({ x: (i + 0.5 + (Math.random() - 0.5) * 0.6) / m * W, v: Math.random(),
                   r: (14 + Math.random() * 12), rot: Math.random() * 1.2, col: cols[i % cols.length] });
    }
  }

  // ---------- drawing helpers ----------
  function drawBackground(t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8af5e4');
    g.addColorStop(0.35, '#38c2f0');
    g.addColorStop(0.7, '#3d7be0');
    g.addColorStop(1, '#5a3fb8');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // soft light rays
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#fff6b0';
    for (var i = 0; i < 4; i++) {
      var x0 = W * (0.1 + i * 0.27) + Math.sin(t * 0.0003 + i) * 30;
      ctx.beginPath();
      ctx.moveTo(x0 - 30, 0);
      ctx.lineTo(x0 + 50, 0);
      ctx.lineTo(x0 + 160, H);
      ctx.lineTo(x0 - 120, H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // sand
    var sandH = Math.max(40, H * 0.1);
    ctx.fillStyle = '#ffdfa6';
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, H - sandH);
    for (var x = 0; x <= W; x += 20) {
      ctx.lineTo(x, H - sandH + Math.sin(x * 0.012) * 8);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawSeaweed(t) {
    var sandH = Math.max(40, H * 0.1);
    var baseY = H - sandH + 10;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var i = 0; i < seaweed.length; i++) {
      var p = seaweed[i];
      var segs = 8;
      ctx.strokeStyle = 'hsl(' + p.hue + ',70%,38%)';
      ctx.lineWidth = p.w;
      ctx.beginPath();
      for (var k = 0; k <= segs; k++) {
        var f = k / segs;
        var sx = p.x + Math.sin(t * 0.0012 * p.sp + p.ph + f * 2.2) * 16 * S * f;
        var sy = baseY - f * p.h;
        if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
      ctx.strokeStyle = 'hsl(' + p.hue + ',75%,52%)';
      ctx.lineWidth = p.w * 0.4;
      ctx.beginPath();
      for (k = 0; k <= segs; k++) {
        f = k / segs;
        sx = p.x - 2 + Math.sin(t * 0.0012 * p.sp + p.ph + f * 2.2) * 16 * S * f;
        sy = baseY - f * p.h;
        if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
    }
  }

  function drawBubbles() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      var a = Math.max(0, Math.min(1, b.life * 1.5)) * 0.9;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, 6.2832);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.22, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function ell(x, y, rx, ry, fill, rot) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, 6.2832);
    ctx.fill();
  }

  function limb(x1, y1, x2, y2, w, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  var YEL = '#ffd21f', YEL_D = '#e8ac00', SKIN = '#f6c9a0', HAIR = '#4a2a1a';

  function drawDiver() {
    var d = diver;
    var speed = Math.sqrt(d.vx * d.vx + d.vy * d.vy);
    var move = Math.min(1, speed / 220);
    var bob = Math.sin(d.t * 1.7) * 8 * (1 - move * 0.7);
    var kick = Math.sin(d.t * (4 + move * 8)) * (0.25 + move * 0.45);
    var tilt = d.pitch + 0.06;

    ctx.save();
    ctx.translate(d.x, d.y + bob);
    ctx.scale(d.face * S, S);
    ctx.rotate(tilt);

    // far leg + far arm
    limb(-40, 12, -92, 18 + kick * 40, 24, YEL_D);
    ell(-108, 20 + kick * 46, 22, 8, '#ff4fa3', 0.3 + kick);
    limb(18, -8, 50, 10 - kick * 14, 15, YEL_D);

    // tank
    ctx.fillStyle = '#2fc7c0';
    ctx.beginPath();
    ctx.roundRect(-52, -62, 28, 62, 12);
    ctx.fill();
    ctx.fillStyle = '#1b9e98';
    ctx.fillRect(-52, -50, 28, 6);
    ell(-38, -66, 6, 4, '#444');

    // body (chubby)
    ell(-2, 0, 54, 40, YEL);
    ell(-2, 8, 50, 30, '#ffe066');
    ctx.strokeStyle = '#ff4fa3';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-40, -22);
    ctx.quadraticCurveTo(-8, -6, 38, -20);
    ctx.stroke();

    // near leg
    limb(-34, 18, -88, 28 - kick * 40, 26, YEL);
    ell(-104, 30 - kick * 46, 22, 8, '#ff7ac2', -0.3 - kick);

    // head: curly hair behind, face, curls in front
    var HC = '#6b3a1e', HL = '#8a521f';
    function curl(cx, cy, r) {
      ell(cx, cy, r, r, HC);
      ctx.strokeStyle = HL; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 0.3, 4.4); ctx.stroke();
    }
    for (var h = 0; h < 10; h++) {          // back and top curls
      var ha = -1.1 - h * 0.5;
      curl(54 + Math.cos(ha) * 31, -26 + Math.sin(ha) * 30, 12.5);
    }
    for (h = 0; h < 7; h++) {               // outer layer for volume
      var hb = -1.3 - h * 0.55;
      curl(54 + Math.cos(hb) * 40, -26 + Math.sin(hb) * 39, 9);
    }
    ell(58, -24, 26, 25, SKIN);             // face
    for (h = 0; h < 6; h++) curl(37 + h * 8.5, -47 + Math.abs(h - 2.5) * 1.6, 8.5);  // fringe curls
    curl(33, -34, 7);

    // cheeks
    ell(42, -14, 6, 4, 'rgba(255,120,130,0.45)');
    ell(75, -14, 6, 4, 'rgba(255,120,130,0.45)');

    // specs
    ctx.strokeStyle = '#d63a7a';
    ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(48, -26, 10, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(70, -26, 10, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(58, -27); ctx.lineTo(60, -27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(38, -28); ctx.lineTo(31, -30); ctx.stroke();

    // eyes
    ell(49, -26, 3, 3.6, '#222');
    ell(71, -26, 3, 3.6, '#222');
    ell(50, -27.5, 1, 1, '#fff');
    ell(72, -27.5, 1, 1, '#fff');

    // smile
    ctx.strokeStyle = '#b3414f';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(60, -16, 9, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    // near arm + hand
    limb(14, -4, 56, 14 + kick * 14, 17, YEL);
    ell(60, 16 + kick * 14, 8, 8, SKIN);

    ctx.restore();
  }

  function drawOneFish(f) {
    var wig = Math.sin(f.t * 8) * 0.25;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.scale(f.face * S * 0.9 * f.size, S * 0.9 * f.size);
    // tail
    ctx.save();
    ctx.translate(-30, 0);
    ctx.rotate(wig);
    ctx.fillStyle = f.tail;
    ctx.beginPath();
    ctx.moveTo(4, 0); ctx.lineTo(-26, -18); ctx.lineTo(-20, 0); ctx.lineTo(-26, 18);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // top fin
    ctx.fillStyle = f.fin;
    ctx.beginPath();
    ctx.moveTo(-10, -20); ctx.quadraticCurveTo(4, -38, 18, -20); ctx.closePath(); ctx.fill();
    // body
    ell(0, 0, 36, 22, f.body);
    // stripes
    ctx.fillStyle = f.stripe;
    ctx.beginPath(); ctx.ellipse(-4, 0, 5, 20, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, 0, 3.5, 16, 0, 0, 6.2832); ctx.fill();
    ell(0, 6, 26, 12, 'rgba(255,200,120,0.35)');
    // eye
    ell(24, -5, 5.5, 5.5, '#fff');
    ell(25.5, -5, 3, 3, '#111');
    // smile
    ctx.strokeStyle = '#a24100'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(28, 4, 5, 0.2, 1.7); ctx.stroke();
    ctx.restore();
  }

  function drawSchool() {
    for (var i = 0; i < school.length; i++) drawOneFish(school[i]);
  }

  function drawMessageFish(t) {
    drawOneFish(fish);
    drawSpeech(t);
  }

  function drawOctopus() {
    var o = octo, k = S * 0.95;
    var pulse = Math.sin(o.t * 2.2);
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.scale(k, k);
    // tentacles
    ctx.lineCap = 'round';
    for (var i = 0; i < 8; i++) {
      var bx = -26 + i * 7.4;
      var pts = [];
      for (var j = 0; j <= 7; j++) {
        pts.push([bx * (1 + j * 0.09) + Math.sin(o.t * 2 + i * 0.8 + j * 0.7) * (3 + j * 1.6),
                  14 + j * 9 + pulse * 2]);
      }
      for (j = 0; j < 7; j++) {
        ctx.strokeStyle = '#9b4dca';
        ctx.lineWidth = 10 - j * 1.1;
        ctx.beginPath(); ctx.moveTo(pts[j][0], pts[j][1]); ctx.lineTo(pts[j + 1][0], pts[j + 1][1]); ctx.stroke();
      }
      ell(pts[3][0], pts[3][1], 2, 2, '#e9c6f5');
    }
    // head
    ell(0, -12 - pulse * 2, 36, 40 + pulse * 2, '#b05cd6');
    ell(-12, -34, 9, 6, 'rgba(255,255,255,0.25)', -0.5);
    ell(14, -26, 4, 4, '#9b4dca'); ell(-18, -18, 3, 3, '#9b4dca'); ell(20, -6, 3, 3, '#9b4dca');
    // eyes
    ell(-13, -6, 10, 11, '#fff'); ell(13, -6, 10, 11, '#fff');
    ell(-11, -5, 5, 6, '#222'); ell(15, -5, 5, 6, '#222');
    ell(-10, -7, 1.6, 1.6, '#fff'); ell(16, -7, 1.6, 1.6, '#fff');
    // cheeks + smile
    ell(-26, 8, 5, 3, 'rgba(255,130,170,0.5)'); ell(26, 8, 5, 3, 'rgba(255,130,170,0.5)');
    ctx.strokeStyle = '#5a1f78'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(2, 6, 8, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    ctx.restore();
  }

  function drawJelly(j) {
    var pulse = Math.sin(j.ph * 1.6);
    ctx.save();
    ctx.translate(j.x, j.y);
    ctx.scale(S * j.size, S * j.size);
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,170,225,0.7)';
    ctx.lineWidth = 3;
    for (var i = 0; i < 5; i++) {
      var x0 = -20 + i * 10;
      ctx.beginPath(); ctx.moveTo(x0, 6);
      for (var k = 1; k <= 6; k++) ctx.lineTo(x0 + Math.sin(j.ph * 2 + i + k * 0.9) * 5, 6 + k * 9 - pulse * 3);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,150,215,0.65)';
    ctx.beginPath();
    ctx.moveTo(-30 - pulse * 3, 8);
    ctx.bezierCurveTo(-30 - pulse * 3, -36 + pulse * 3, 30 + pulse * 3, -36 + pulse * 3, 30 + pulse * 3, 8);
    ctx.quadraticCurveTo(15, 14, 0, 8); ctx.quadraticCurveTo(-15, 14, -30 - pulse * 3, 8);
    ctx.fill();
    ell(-8, -14, 8, 5, 'rgba(255,255,255,0.4)', -0.4);
    ell(-8, -4, 2.5, 3, '#6b2b5e'); ell(8, -4, 2.5, 3, '#6b2b5e');
    ctx.restore();
  }

  function drawCoral(c) {
    var sandH = Math.max(40, H * 0.1);
    ctx.save();
    ctx.translate(c.x, H - sandH + 16);
    ctx.scale(S * c.s, S * c.s);
    ctx.strokeStyle = c.col; ctx.fillStyle = c.col; ctx.lineCap = 'round';
    ctx.lineWidth = 11;
    var br = [[0, 0, 0, -48], [0, -26, -26, -62], [0, -30, 28, -66], [0, -48, -6, -84], [-14, -44, -34, -50]];
    ctx.beginPath();
    for (var i = 0; i < br.length; i++) { ctx.moveTo(br[i][0], br[i][1]); ctx.lineTo(br[i][2], br[i][3]); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (i = 1; i < br.length; i++) { ctx.beginPath(); ctx.arc(br[i][2], br[i][3], 3.2, 0, 6.2832); ctx.fill(); }
    ctx.restore();
  }

  function drawStar(st) {
    var sandH = Math.max(40, H * 0.1);
    var y = H - sandH + 16 + st.v * (sandH - 34);
    var r = st.r * S;
    ctx.save();
    ctx.translate(st.x, y);
    ctx.rotate(st.rot);
    ctx.fillStyle = st.col; ctx.strokeStyle = st.col;
    ctx.lineJoin = 'round'; ctx.lineWidth = r * 0.35;
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rr = (i % 2 === 0 ? r : r * 0.45), a = -Math.PI / 2 + i * Math.PI / 5;
      var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (i = 0; i < 5; i++) {
      var a2 = -Math.PI / 2 + i * 2 * Math.PI / 5;
      ctx.beginPath(); ctx.arc(Math.cos(a2) * r * 0.55, Math.sin(a2) * r * 0.55, r * 0.09, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function drawCrab() {
    var sandH = Math.max(40, H * 0.1);
    var c = crab, k = S * 0.7;
    var walk = c.pause > 0 ? 0 : Math.sin(c.t * 14);
    ctx.save();
    ctx.translate(c.x, H - sandH * 0.45);
    ctx.scale(k, k);
    ctx.strokeStyle = '#d63a2f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      var off = (i % 2 ? 1 : -1) * walk * 4;
      ctx.beginPath(); ctx.moveTo(-18, 6); ctx.lineTo(-34 - i * 3, 12 + i * 4 + off); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(18, 6); ctx.lineTo(34 + i * 3, 12 + i * 4 - off); ctx.stroke();
    }
    // claws
    var up = c.pause > 0 ? Math.sin(c.t * 6) * 5 : 0;
    ctx.beginPath(); ctx.moveTo(-20, -4); ctx.lineTo(-34, -22 - up); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(20, -4); ctx.lineTo(34, -22 + up); ctx.stroke();
    ell(-36, -28 - up, 10, 8, '#ef4a3d'); ell(36, -28 + up, 10, 8, '#ef4a3d');
    ctx.fillStyle = '#4b9fd0'; ctx.fillRect(-40, -30 - up, 8, 2); ctx.fillRect(32, -30 + up, 8, 2);
    ell(0, 2, 26, 17, '#ef4a3d');
    ell(0, 6, 20, 9, '#ff7a6b');
    ctx.strokeStyle = '#d63a2f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-8, -12); ctx.lineTo(-8, -20); ctx.moveTo(8, -12); ctx.lineTo(8, -20); ctx.stroke();
    ell(-8, -22, 5, 5, '#fff'); ell(8, -22, 5, 5, '#fff');
    ell(-8, -22, 2.4, 2.4, '#111'); ell(8, -22, 2.4, 2.4, '#111');
    ctx.strokeStyle = '#7a1a14'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 2, 7, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    ctx.restore();
  }

  function wrap(text, maxW) {
    var words = text.split(' '), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    lines.push(line);
    return lines;
  }

  function drawSpeech() {
    var fs = Math.max(14, Math.min(22, W / 28));
    ctx.font = '600 ' + fs + 'px "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
    var maxW = Math.min(300, W * 0.7);
    var lines = wrap(MESSAGE, maxW - 28);
    var tw = 0;
    for (var i = 0; i < lines.length; i++) tw = Math.max(tw, ctx.measureText(lines[i]).width);
    var bw = tw + 28, lh = fs * 1.3, bh = lines.length * lh + 20;
    var bx = fish.x - bw / 2;
    bx = Math.max(8, Math.min(W - bw - 8, bx));
    var by = fish.y - 34 * S - bh - 14;
    if (by < 8) by = 8;

    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeStyle = 'rgba(10,79,122,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 14);
    ctx.fill(); ctx.stroke();

    // tail pointing at fish
    var tx = Math.max(bx + 18, Math.min(bx + bw - 18, fish.x));
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.moveTo(tx - 9, by + bh - 1);
    ctx.lineTo(fish.x, Math.min(fish.y - 26 * S, by + bh + 14));
    ctx.lineTo(tx + 9, by + bh - 1);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#0a4f7a';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], bx + bw / 2, by + 10 + lh * (i + 0.5));
    }
  }

  // ---------- update ----------
  function spawn(x, y, r, vx) {
    bubbles.push({
      x: x, y: y, r: r,
      vy: -(40 + Math.random() * 40),
      vx: vx || 0,
      ph: Math.random() * 6.28,
      wob: 8 + Math.random() * 12,
      life: 1,
      decay: 0.12 + Math.random() * 0.1
    });
  }

  var mouthTimer = 0, tankTimer = 0;

  function update(dt, t) {
    var d = diver;
    d.t += dt;

    // smooth spring-like follow: gentle start, soft stop (a little floatier going up/down)
    d.vx += ((target.x - d.x) * 14 - d.vx * 7.5) * dt;
    d.vy += ((target.y - d.y) * 9 - d.vy * 6) * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.pitch += (Math.max(-0.6, Math.min(0.6, d.vy / 330)) - d.pitch) * Math.min(1, dt * 5);
    var dx = target.x - d.x;
    if (Math.abs(dx) > 18) d.face = dx > 0 ? 1 : -1;

    // bubbles from mouth and tank
    var speed = Math.sqrt(d.vx * d.vx + d.vy * d.vy);
    mouthTimer -= dt; tankTimer -= dt;
    if (mouthTimer <= 0) {
      spawn(d.x + d.face * 66 * S, d.y - 14 * S, (3 + Math.random() * 4) * S, d.vx * 0.15);
      mouthTimer = 0.28 - Math.min(0.1, speed / 2000);
    }
    if (tankTimer <= 0) {
      spawn(d.x - d.face * 40 * S, d.y - 70 * S, (2 + Math.random() * 3) * S, d.vx * 0.1);
      tankTimer = 0.55;
    }

    for (var i = bubbles.length - 1; i >= 0; i--) {
      var b = bubbles[i];
      b.ph += dt * 3;
      b.y += b.vy * dt;
      b.x += (b.vx + Math.cos(b.ph) * b.wob) * dt;
      b.vx *= 0.98;
      b.vy -= 6 * dt;
      b.life -= b.decay * dt;
      if (b.life <= 0 || b.y < -20) bubbles.splice(i, 1);
    }

    updateFish(fish, dt);
    for (i = 0; i < school.length; i++) updateFish(school[i], dt);

    // octopus drifts slowly
    var o = octo;
    o.t += dt;
    var odx = o.wx - o.x, ody = o.wy - o.y, od = Math.sqrt(odx * odx + ody * ody);
    if (od < 25) { o.wx = W * (0.1 + Math.random() * 0.8); o.wy = H * (0.45 + Math.random() * 0.25); }
    else {
      o.vx += (odx / od * 26 * S - o.vx) * Math.min(1, dt);
      o.vy += (ody / od * 18 * S - o.vy) * Math.min(1, dt);
    }
    o.x += o.vx * dt; o.y += o.vy * dt + Math.sin(o.t * 2.2) * 0.25;

    for (i = 0; i < jellies.length; i++) {
      var j = jellies[i];
      j.ph += dt;
      j.x = j.bx + Math.sin(j.ph * 0.4) * W * 0.12;
      j.y = j.by + Math.sin(j.ph * 1.6) * 14 + Math.sin(j.ph * 0.25) * H * 0.06;
    }

    // crab scuttles sideways, pausing now and then
    var c = crab;
    c.t += dt;
    if (c.pause > 0) c.pause -= dt;
    else {
      c.x += c.dir * 30 * S * dt;
      if (c.x > W * 0.92) c.dir = -1; else if (c.x < W * 0.08) c.dir = 1;
      if (Math.random() < dt * 0.25) c.pause = 1 + Math.random() * 1.5;
    }
  }

  function updateFish(f, dt) {
    f.t += dt;
    var fdx = f.wx - f.x, fdy = f.wy - f.y;
    var dist = Math.sqrt(fdx * fdx + fdy * fdy);
    if (dist < 30) pickFishWaypoint(f);
    else {
      var sp = f.sp * S;
      f.vx += (fdx / dist * sp - f.vx) * Math.min(1, dt * 1.5);
      f.vy += (fdy / dist * sp * 0.6 - f.vy) * Math.min(1, dt * 1.5);
    }
    f.x += f.vx * dt; f.y += f.vy * dt + Math.sin(f.t * 1.5) * 0.15;
    if (Math.abs(f.vx) > 8) f.face = f.vx > 0 ? 1 : -1;
  }

  // ---------- main loop ----------
  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    if (!started) {
      diver.x = target.x = W * 0.5;
      diver.y = target.y = H * 0.55;
      fish.x = W * 0.75; fish.y = H * 0.35;
      pickFishWaypoint();
      initCreatures();
      started = true;
    }
    update(dt, now);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawBackground(now);
    drawSeaweed(now);
    for (var q = 0; q < corals.length; q++) drawCoral(corals[q]);
    for (q = 0; q < stars.length; q++) drawStar(stars[q]);
    drawCrab();
    for (q = 0; q < jellies.length; q++) drawJelly(jellies[q]);
    drawOctopus();
    drawBubbles();
    drawSchool();
    drawDiver();
    drawMessageFish(now);
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
