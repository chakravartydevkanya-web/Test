<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ocean Birthday</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a4f7a; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<script>
(function () {
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
    };
  }
  var canvas = document.getElementById('sea');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, S = 1, dpr = 1;
  var MESSAGE = "Happy belated b'day Riddhi, see you in Jan";

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    S = Math.max(0.55, Math.min(1.25, Math.min(W, H) / 560)); // diver scale
    buildSeaweed();
  }

  // ---------- state ----------
  var diver = { x: 0, y: 0, vx: 0, vy: 0, face: 1, t: 0 };
  var target = { x: 0, y: 0 };
  var bubbles = [];
  var seaweed = [];
  var fish = { x: 0, y: 0, vx: 40, vy: 0, wx: 0, wy: 0, face: 1, t: 0 };
  var started = false;

  function setTarget(e) {
    target.x = e.clientX; target.y = e.clientY;
    if (e.cancelable && e.pointerType === 'touch') e.preventDefault();
  }
  window.addEventListener('pointermove', setTarget, { passive: false });
  window.addEventListener('pointerdown', setTarget, { passive: false });
  window.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener('resize', resize);

  function buildSeaweed() {
    seaweed = [];
    var n = Math.max(5, Math.round(W / 130));
    for (var i = 0; i < n; i++) {
      seaweed.push({
        x: (i + 0.3 + Math.random() * 0.4) / n * W,
        h: (70 + Math.random() * 110) * S,
        w: (9 + Math.random() * 5) * S,
        ph: Math.random() * 6.28,
        sp: 0.8 + Math.random() * 0.6,
        hue: 125 + Math.random() * 25
      });
    }
  }

  function pickFishWaypoint() {
    fish.wx = W * (0.12 + Math.random() * 0.76);
    fish.wy = H * (0.30 + Math.random() * 0.35);
  }

  // ---------- drawing helpers ----------
  function drawBackground(t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#5fd0e6');
    g.addColorStop(0.5, '#1d8fbf');
    g.addColorStop(1, '#0a4f7a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // soft light rays
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < 4; i++) {
      var x0 = W * (0.1 + i * 0.27) + Math.sin(t * 0.0003 + i) * 30;
      ctx.beginPath();
      ctx.moveTo(x0 - 30, 0);
      ctx.lineTo(x0 + 50, 0);
      ctx.lineTo(x0 + 160, H);
      ctx.lineTo(x0 - 120, H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // sand
    var sandH = Math.max(40, H * 0.1);
    ctx.fillStyle = '#e8cf93';
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, H - sandH);
    for (var x = 0; x <= W; x += 20) {
      ctx.lineTo(x, H - sandH + Math.sin(x * 0.012) * 8);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawSeaweed(t) {
    var sandH = Math.max(40, H * 0.1);
    var baseY = H - sandH + 10;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var i = 0; i < seaweed.length; i++) {
      var p = seaweed[i];
      var segs = 8;
      ctx.strokeStyle = 'hsl(' + p.hue + ',55%,32%)';
      ctx.lineWidth = p.w;
      ctx.beginPath();
      for (var k = 0; k <= segs; k++) {
        var f = k / segs;
        var sx = p.x + Math.sin(t * 0.0012 * p.sp + p.ph + f * 2.2) * 16 * S * f;
        var sy = baseY - f * p.h;
        if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
      ctx.strokeStyle = 'hsl(' + p.hue + ',55%,42%)';
      ctx.lineWidth = p.w * 0.4;
      ctx.beginPath();
      for (k = 0; k <= segs; k++) {
        f = k / segs;
        sx = p.x - 2 + Math.sin(t * 0.0012 * p.sp + p.ph + f * 2.2) * 16 * S * f;
        sy = baseY - f * p.h;
        if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
    }
  }

  function drawBubbles() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      var a = Math.max(0, Math.min(1, b.life * 1.5)) * 0.9;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, 6.2832);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.22, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function ell(x, y, rx, ry, fill, rot) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, 6.2832);
    ctx.fill();
  }

  function limb(x1, y1, x2, y2, w, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  var YEL = '#ffd21f', YEL_D = '#e8ac00', SKIN = '#f6c9a0', HAIR = '#4a2a1a';

  function drawDiver() {
    var d = diver;
    var speed = Math.sqrt(d.vx * d.vx + d.vy * d.vy);
    var move = Math.min(1, speed / 220);
    var bob = Math.sin(d.t * 2) * 4 * (1 - move * 0.6);
    var kick = Math.sin(d.t * (4 + move * 8)) * (0.25 + move * 0.45);
    var tilt = Math.max(-0.5, Math.min(0.5, d.vy / 500)) + 0.08;

    ctx.save();
    ctx.translate(d.x, d.y + bob);
    ctx.scale(d.face * S, S);
    ctx.rotate(tilt);

    // far leg + far arm
    limb(-40, 12, -92, 18 + kick * 40, 24, YEL_D);
    ell(-108, 20 + kick * 46, 22, 8, '#2b2f3a', 0.3 + kick);
    limb(18, -8, 50, 10 - kick * 14, 15, YEL_D);

    // tank
    ctx.fillStyle = '#7fa6b8';
    ctx.beginPath();
    ctx.roundRect(-52, -62, 28, 62, 12);
    ctx.fill();
    ctx.fillStyle = '#5d8396';
    ctx.fillRect(-52, -50, 28, 6);
    ell(-38, -66, 6, 4, '#444');

    // body (chubby)
    ell(-2, 0, 54, 40, YEL);
    ell(-2, 8, 50, 30, '#ffe066');
    ctx.strokeStyle = '#2b2f3a';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-40, -22);
    ctx.quadraticCurveTo(-8, -6, 38, -20);
    ctx.stroke();

    // near leg
    limb(-34, 18, -88, 28 - kick * 40, 26, YEL);
    ell(-104, 30 - kick * 46, 22, 8, '#2b2f3a', -0.3 - kick);

    // head: hair back + bun, hood, face
    ell(46, -52, 14, 14, HAIR);            // bun
    ell(44, -30, 34, 33, HAIR);            // hair back
    ell(54, -26, 31, 30, YEL);             // hood
    ell(58, -24, 25, 24, SKIN);            // face

    // fringe
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.ellipse(58, -42, 24, 10, 0.05, Math.PI, 6.2832);
    ctx.fill();

    // cheeks
    ell(42, -14, 6, 4, 'rgba(255,120,130,0.45)');
    ell(75, -14, 6, 4, 'rgba(255,120,130,0.45)');

    // specs
    ctx.strokeStyle = '#d63a7a';
    ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(48, -26, 10, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(70, -26, 10, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(58, -27); ctx.lineTo(60, -27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(38, -28); ctx.lineTo(31, -30); ctx.stroke();

    // eyes
    ell(49, -26, 3, 3.6, '#222');
    ell(71, -26, 3, 3.6, '#222');
    ell(50, -27.5, 1, 1, '#fff');
    ell(72, -27.5, 1, 1, '#fff');

    // smile
    ctx.strokeStyle = '#b3414f';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(60, -16, 9, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    // near arm + hand
    limb(14, -4, 56, 14 + kick * 14, 17, YEL);
    ell(60, 16 + kick * 14, 8, 8, SKIN);

    ctx.restore();
  }

  function drawFish(t) {
    var f = fish;
    var wig = Math.sin(f.t * 8) * 0.25;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.scale(f.face * S * 0.9, S * 0.9);
    // tail
    ctx.save();
    ctx.translate(-30, 0);
    ctx.rotate(wig);
    ctx.fillStyle = '#ff7a00';
    ctx.beginPath();
    ctx.moveTo(4, 0); ctx.lineTo(-26, -18); ctx.lineTo(-20, 0); ctx.lineTo(-26, 18);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // top fin
    ctx.fillStyle = '#ff9a2e';
    ctx.beginPath();
    ctx.moveTo(-10, -20); ctx.quadraticCurveTo(4, -38, 18, -20); ctx.closePath(); ctx.fill();
    // body
    ell(0, 0, 36, 22, '#ff8a1f');
    // stripes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-4, 0, 5, 20, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, 0, 3.5, 16, 0, 0, 6.2832); ctx.fill();
    ell(0, 6, 26, 12, 'rgba(255,200,120,0.35)');
    // eye
    ell(24, -5, 5.5, 5.5, '#fff');
    ell(25.5, -5, 3, 3, '#111');
    // smile
    ctx.strokeStyle = '#a24100'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(28, 4, 5, 0.2, 1.7); ctx.stroke();
    ctx.restore();

    drawSpeech(t);
  }

  function wrap(text, maxW) {
    var words = text.split(' '), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    lines.push(line);
    return lines;
  }

  function drawSpeech() {
    var fs = Math.max(14, Math.min(22, W / 28));
    ctx.font = '600 ' + fs + 'px "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
    var maxW = Math.min(300, W * 0.7);
    var lines = wrap(MESSAGE, maxW - 28);
    var tw = 0;
    for (var i = 0; i < lines.length; i++) tw = Math.max(tw, ctx.measureText(lines[i]).width);
    var bw = tw + 28, lh = fs * 1.3, bh = lines.length * lh + 20;
    var bx = fish.x - bw / 2;
    bx = Math.max(8, Math.min(W - bw - 8, bx));
    var by = fish.y - 34 * S - bh - 14;
    if (by < 8) by = 8;

    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeStyle = 'rgba(10,79,122,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 14);
    ctx.fill(); ctx.stroke();

    // tail pointing at fish
    var tx = Math.max(bx + 18, Math.min(bx + bw - 18, fish.x));
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.moveTo(tx - 9, by + bh - 1);
    ctx.lineTo(fish.x, Math.min(fish.y - 26 * S, by + bh + 14));
    ctx.lineTo(tx + 9, by + bh - 1);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#0a4f7a';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], bx + bw / 2, by + 10 + lh * (i + 0.5));
    }
  }

  // ---------- update ----------
  function spawn(x, y, r, vx) {
    bubbles.push({
      x: x, y: y, r: r,
      vy: -(40 + Math.random() * 40),
      vx: vx || 0,
      ph: Math.random() * 6.28,
      wob: 8 + Math.random() * 12,
      life: 1,
      decay: 0.12 + Math.random() * 0.1
    });
  }

  var mouthTimer = 0, tankTimer = 0;

  function update(dt, t) {
    var d = diver;
    d.t += dt;

    // smooth follow: ease toward the pointer
    var k = 1 - Math.pow(0.02, dt);          // frame-rate independent easing
    var nx = d.x + (target.x - d.x) * k * 0.9;
    var ny = d.y + (target.y - d.y) * k * 0.9;
    var ivx = (nx - d.x) / Math.max(dt, 0.001);
    var ivy = (ny - d.y) / Math.max(dt, 0.001);
    d.vx += (ivx - d.vx) * Math.min(1, dt * 10);
    d.vy += (ivy - d.vy) * Math.min(1, dt * 10);
    d.x = nx; d.y = ny;
    var dx = target.x - d.x;
    if (Math.abs(dx) > 18) d.face = dx > 0 ? 1 : -1;

    // bubbles from mouth and tank
    var speed = Math.sqrt(d.vx * d.vx + d.vy * d.vy);
    mouthTimer -= dt; tankTimer -= dt;
    if (mouthTimer <= 0) {
      spawn(d.x + d.face * 66 * S, d.y - 14 * S, (3 + Math.random() * 4) * S, d.vx * 0.15);
      mouthTimer = 0.28 - Math.min(0.1, speed / 2000);
    }
    if (tankTimer <= 0) {
      spawn(d.x - d.face * 40 * S, d.y - 70 * S, (2 + Math.random() * 3) * S, d.vx * 0.1);
      tankTimer = 0.55;
    }

    for (var i = bubbles.length - 1; i >= 0; i--) {
      var b = bubbles[i];
      b.ph += dt * 3;
      b.y += b.vy * dt;
      b.x += (b.vx + Math.cos(b.ph) * b.wob) * dt;
      b.vx *= 0.98;
      b.vy -= 6 * dt;
      b.life -= b.decay * dt;
      if (b.life <= 0 || b.y < -20) bubbles.splice(i, 1);
    }

    // fish
    var f = fish;
    f.t += dt;
    var fdx = f.wx - f.x, fdy = f.wy - f.y;
    var dist = Math.sqrt(fdx * fdx + fdy * fdy);
    if (dist < 30) pickFishWaypoint();
    else {
      var sp = 55 * S;
      f.vx += (fdx / dist * sp - f.vx) * Math.min(1, dt * 1.5);
      f.vy += (fdy / dist * sp * 0.6 - f.vy) * Math.min(1, dt * 1.5);
    }
    f.x += f.vx * dt; f.y += f.vy * dt + Math.sin(f.t * 1.5) * 0.15;
    if (Math.abs(f.vx) > 8) f.face = f.vx > 0 ? 1 : -1;
  }

  // ---------- main loop ----------
  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    if (!started) {
      diver.x = target.x = W * 0.5;
      diver.y = target.y = H * 0.55;
      fish.x = W * 0.75; fish.y = H * 0.35;
      pickFishWaypoint();
      started = true;
    }
    update(dt, now);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawBackground(now);
    drawSeaweed(now);
    drawBubbles();
    drawFish(now);
    drawDiver();
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
